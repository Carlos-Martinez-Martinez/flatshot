name: Feature request
description: Propose a focused improvement to an existing FlatShot workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Workflow need
      description: What existing workflow is difficult or incomplete?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the user-visible result without prescribing a broad rewrite.
    validations:
      required: true
  - type: dropdown
    id: output-impact
    attributes:
      label: Expected exported-image impact
      options:
        - None
        - Intentional visual change
        - File naming or destination change
        - Unknown
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request builds on a product concept already present in FlatShot.
          required: true
