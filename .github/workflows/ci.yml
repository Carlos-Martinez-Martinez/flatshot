name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Run Python lint
        if: matrix.python-version == '3.13'
        run: python -m ruff check .

      - name: Run CSS audit
        if: matrix.python-version == '3.13'
        run: python scripts/audit_css.py --check

      - name: Check application answer limits
        if: matrix.python-version == '3.13'
        run: python scripts/check_application_answers.py

      - name: Run frontend E2E smoke test
        if: matrix.python-version == '3.13'
        run: python scripts/e2e_smoke.py

      - name: Run visual regression smoke test
        if: matrix.python-version == '3.13'
        run: python scripts/visual_regression_smoke.py

      - name: Run render benchmark smoke test
        if: matrix.python-version == '3.13'
        run: python scripts/benchmark_shadow_v2.py --smoke --runs 1

      - name: Build development portable smoke test
        if: matrix.python-version == '3.13'
        run: python scripts/build_portable.py --skip-venv

      - name: Build Python package
        if: matrix.python-version == '3.13'
        run: python -m build
