name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild and publish"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          $taggedCommit = git rev-parse "$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag does not resolve to a commit."
          }
          git merge-base --is-ancestor "$taggedCommit" "origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit reachable from origin/main."
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.txt

      - name: Verify tag and package versions
        run: python scripts/check_release_version.py "$env:RELEASE_TAG"

      - name: Run quality suite
        run: python scripts/check_all.py

      - name: Run render benchmark smoke test
        run: python scripts/benchmark_shadow_v2.py --smoke --runs 1

      - name: Build Python distributions
        run: python -m build

      - name: Build and package frozen portable candidate
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          python scripts/package_release_candidate.py --version $version

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: FlatShot-release-${{ github.run_id }}
          path: |
            release/FlatShotPortable-${{ env.RELEASE_TAG }}.zip
            release/SHA256SUMS.txt
            dist/*
          if-no-files-found: error
          retention-days: 30

  portable-verification:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up verification Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download release candidate
        uses: actions/download-artifact@v8
        with:
          name: FlatShot-release-${{ github.run_id }}
          path: release-artifacts

      - name: Verify checksum, relocatability, frozen smoke, and normal launch
        shell: pwsh
        run: |
          $archive = Get-ChildItem release-artifacts -Recurse -File -Filter "FlatShotPortable-*.zip" |
            Select-Object -First 1 -ExpandProperty FullName
          $checksums = Get-ChildItem release-artifacts -Recurse -File -Filter "SHA256SUMS.txt" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $archive -or -not $checksums) {
            throw "Portable archive or checksum file is missing."
          }
          $extractTo = Join-Path $env:RUNNER_TEMP "FlatShot verification á $env:GITHUB_RUN_ID"
          python scripts/verify_portable_candidate.py $archive $checksums `
            --extract-to $extractTo `
            --forbid-root $env:GITHUB_WORKSPACE `
            --forbid-root $env:RUNNER_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            throw "Structural or frozen smoke verification failed."
          }

          $evidence = Join-Path $env:RUNNER_TEMP "FlatShot normal launch evidence"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          "NORMAL_LAUNCH_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $portableRoot = Join-Path $extractTo "FlatShotPortable"
          $screenshot = Join-Path $evidence "flatshot-normal-launch.png"
          $result = Join-Path $evidence "normal-launch-result.json"
          & scripts/verify_portable_normal_launch.ps1 `
            -PortableRoot $portableRoot `
            -ScreenshotPath $screenshot `
            -ResultPath $result
          $runtimeLog = Join-Path $portableRoot "data\logs\runtime.log"
          if (Test-Path -LiteralPath $runtimeLog) {
            Copy-Item -LiteralPath $runtimeLog -Destination (Join-Path $evidence "runtime.log") -Force
          }
          python scripts/verify_normal_launch_result.py $result
          if ($LASTEXITCODE -ne 0) {
            throw "Normal frozen launch verification failed."
          }

      - name: Upload normal launch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FlatShot-normal-launch-${{ github.run_id }}
          path: ${{ env.NORMAL_LAUNCH_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: portable-verification
    runs-on: windows-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@v8
        with:
          name: FlatShot-release-${{ github.run_id }}
          path: release-artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath "release-artifacts" -File -Recurse |
            ForEach-Object { $_.FullName }
          if (-not $assets) {
            throw "No release artifacts were downloaded."
          }
          & gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --generate-notes `
            --title "FlatShot $env:RELEASE_TAG"
