[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flatshot"
version = "1.0.0"
description = "Procesa imágenes de producto por lotes, aplica sombras realistas y prepara salidas listas para e-commerce."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "FlatShot Team"}
]
dependencies = [
    "Pillow>=9.5.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.scripts]
flatshot = "flatshot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["release", "venv", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
